<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sali</title>
  <link rel="icon" href="/sali/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/common/common.css">
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <h1>Sali</h1>
      <p class="subtitle">Seuraa treeniäsi</p>
      <div id="google-signin-btn" class="google-signin-wrapper"></div>
      <p id="login-error" class="login-error" hidden></p>
    </div>
  </div>

  <!-- App (hidden until authenticated) -->
  <div id="app-container" hidden>
    <!-- Header injected by common.js -->

    <div class="app-layout sali-layout">
      <!-- Gym sub-tab nav -->
      <nav class="sali-tab-nav">
        <button class="sidebar-gym-btn active" data-gym-tab="programs" data-i18n="programs_tab">Ohjelmat</button>
        <button class="sidebar-gym-btn" data-gym-tab="workout" data-i18n="workout_tab">Treeni</button>
        <button class="sidebar-gym-btn" data-gym-tab="history" data-i18n="history_tab">Historia</button>
        <button class="sidebar-gym-btn" data-gym-tab="progress" data-i18n="progress_tab">Kehitys</button>
      </nav>

      <main class="main-content">
        <p id="error-message" class="error-message" hidden></p>

        <!-- Programs sub-view -->
        <div id="gym-programs" class="gym-section">
          <div class="gym-section-actions">
            <button class="btn btn-primary btn-sm" id="add-program-btn" data-i18n="add_program_btn">+ Uusi ohjelma</button>
            <label class="archived-toggle">
              <input type="checkbox" id="show-archived"> <span data-i18n="show_archived_label">Näytä arkistoidut</span>
            </label>
          </div>

          <!-- Exercise library -->
          <details class="exercise-library">
            <summary class="library-summary">
              <span data-i18n="exercises_heading">Liikkeet</span>
              <button class="btn btn-icon btn-sm" id="add-library-exercise-btn" data-i18n="add_exercise_lib_btn">+ Lisää</button>
            </summary>
            <form id="add-library-exercise-form" class="inline-form" hidden>
              <input type="text" id="new-library-exercise-name" data-i18n-placeholder="exercise_name_placeholder" placeholder="Liikkeen nimi" required autocomplete="off">
              <button type="submit" class="btn btn-primary btn-sm" data-i18n="add_btn">Lisää</button>
              <button type="button" class="btn btn-secondary btn-sm" id="cancel-library-exercise-btn" data-i18n="cancel">Peruuta</button>
            </form>
            <div id="library-exercises-list"></div>
          </details>

          <div id="add-program-form-wrap" class="add-program-form-wrap" hidden>
            <form id="add-program-form" class="inline-form">
              <input type="text" id="new-program-name" data-i18n-placeholder="program_name_placeholder" placeholder="Ohjelman nimi" required autocomplete="off">
              <button type="submit" class="btn btn-primary btn-sm" data-i18n="create_btn">Luo</button>
              <button type="button" class="btn btn-secondary btn-sm" id="cancel-add-program" data-i18n="cancel">Peruuta</button>
            </form>
          </div>
          <div id="programs-list"></div>
          <div id="program-detail" hidden></div>
        </div>

        <!-- Workout sub-view -->
        <div id="gym-workout" class="gym-section" hidden>
          <div id="workout-idle">
            <div id="last-session-info" class="last-session-info" hidden></div>
            <div class="form-group">
              <label for="workout-program-select" data-i18n="label_select_program">Valitse ohjelma</label>
              <select id="workout-program-select"></select>
            </div>
            <button class="btn btn-primary" id="start-workout-btn" data-i18n="start_workout_btn">Aloita treeni</button>
          </div>
          <div id="workout-active" hidden>
            <div class="workout-header">
              <div class="workout-title-block">
                <h3 id="active-program-name"></h3>
                <span id="workout-start-time" class="workout-start-time"></span>
              </div>
              <button class="btn btn-cancel-workout" id="cancel-workout-btn" data-i18n="cancel_workout_btn">Keskeytä treeni</button>
              <button class="btn btn-primary" id="complete-workout-btn" data-i18n="complete_workout_btn_text">Treeni valmis!</button>
            </div>
            <div id="active-exercises"></div>
          </div>
        </div>

        <!-- History sub-view -->
        <div id="gym-history" class="gym-section" hidden>
          <div id="sessions-list"></div>
        </div>

        <!-- Progress sub-view -->
        <div id="gym-progress" class="gym-section" hidden>
          <div class="progress-sticky-bar">
            <div class="progress-range-btns">
              <button class="btn btn-sm progress-range-btn" data-progress-range="3" data-i18n="progress_range_3m">3 kk</button>
              <button class="btn btn-sm progress-range-btn" data-progress-range="6" data-i18n="progress_range_6m">6 kk</button>
              <button class="btn btn-sm progress-range-btn" data-progress-range="12" data-i18n="progress_range_1y">1 v</button>
              <button class="btn btn-sm progress-range-btn active" data-progress-range="all" data-i18n="progress_range_all">Kaikki</button>
            </div>
          </div>
          <table id="progress-all-table" class="progress-stats-table progress-all-table" hidden>
            <thead>
              <tr>
                <th data-i18n="exercise_name_placeholder">Liike</th>
                <th data-i18n="progress_stats_reps">Toistot</th>
                <th data-i18n="progress_stats_min">Min</th>
                <th></th>
                <th data-i18n="progress_stats_max">Max</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div id="progress-accordion"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Complete workout modal -->
  <div id="complete-workout-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <h2 data-i18n="complete_workout_heading">Treeni valmis!</h2>
      <div id="cwm-summary-list" class="cwm-summary-list"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cwm-cancel" data-i18n="cancel">Peruuta</button>
        <button class="btn btn-primary" id="cwm-confirm" data-i18n="cwm_confirm_btn">Valmis!</button>
      </div>
    </div>
  </div>

  <!-- Gym exercise modal -->
  <div id="gym-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-labelledby="gym-modal-title" aria-modal="true">
      <h2 id="gym-modal-title">Liike</h2>
      <form id="gym-modal-form">
        <input type="hidden" id="gym-modal-program-id">
        <input type="hidden" id="gym-modal-exercise-id">
        <div class="form-group" id="gym-modal-select-group">
          <label for="gym-ex-select" data-i18n="label_exercise">Liike</label>
          <select id="gym-ex-select" required>
            <option value="">Valitse liike...</option>
          </select>
        </div>
        <div class="form-group" id="gym-modal-name-display" hidden>
          <label for="gym-modal-exercise-name" data-i18n="label_exercise">Liike</label>
          <input type="text" id="gym-modal-exercise-name" autocomplete="off">
        </div>
        <div id="gym-modal-program-fields">
          <div class="form-group">
            <label for="gym-ex-sets" data-i18n="label_sets">Sarjat</label>
            <input type="number" id="gym-ex-sets" min="1" value="3">
          </div>
          <div class="form-group">
            <label for="gym-ex-reps" data-i18n="label_reps">Toistot</label>
            <input type="number" id="gym-ex-reps" min="1" value="10">
          </div>
          <div class="form-group">
            <label for="gym-ex-rest" data-i18n="label_rest_seconds">Lepotauko (sekuntia)</label>
            <input type="number" id="gym-ex-rest" min="0" value="90">
          </div>
        </div>
        <div id="gym-modal-config-fields" hidden>
          <div class="form-group">
            <label for="gym-ex-weight" data-i18n="label_weight_kg">Paino (kg)</label>
            <input type="number" id="gym-ex-weight" step="0.5" min="0" value="0">
          </div>
          <div class="form-group">
            <label class="autoinc-toggle-label">
              <input type="checkbox" id="gym-autoinc-enabled">
              <span data-i18n="autoinc_label">Nouseva ohjelma</span>
            </label>
          </div>
          <div id="gym-autoinc-settings" hidden>
            <div class="form-group">
              <label for="gym-autoinc-increment" data-i18n="autoinc_increment_label">Nousu / treeni (kg)</label>
              <select id="gym-autoinc-increment">
                <option value="2.5">2.5 kg</option>
                <option value="5">5 kg</option>
              </select>
            </div>
            <div class="form-group">
              <label for="gym-deload-mode" data-i18n="deload_mode_label">Deload-tyyppi</label>
              <select id="gym-deload-mode">
                <option value="reset" data-i18n="deload_mode_reset">Pohjapaino + nousu</option>
                <option value="percent" data-i18n="deload_mode_percent">−10% (StrongLifts)</option>
              </select>
            </div>
            <div class="form-group" id="gym-reset-group">
              <label for="gym-autoinc-reset" data-i18n="autoinc_reset_label">Pohjan nousu resetissä (kg)</label>
              <input type="number" id="gym-autoinc-reset" step="any" min="0" value="5">
            </div>
            <div class="form-group">
              <label for="gym-failure-threshold" data-i18n="failure_threshold_label">Epäonnistumisia ennen deloadia</label>
              <input type="number" id="gym-failure-threshold" min="1" max="10" value="3">
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="gym-modal-cancel" data-i18n="cancel">Peruuta</button>
          <button type="submit" class="btn btn-primary" data-i18n="save">Tallenna</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/common/common.js"></script>
  <script src="/sali/sali.js"></script>
</body>
</html>
